---
# The format/file extension of the Nessus package file (e.g. deb, rpm)
format: rpm

# A regex that will match the name of the Nessus package file that
# should be installed
package_file_regex: >-
  Nessus-{{ nessus_version }}-{{ ansible_distribution | lower }}[0-9]*\\.{{
  ansible_architecture }}\\.{{ format }}

# The packages to install
package_names:
  - expect
  - jq
